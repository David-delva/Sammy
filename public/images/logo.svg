<svg xmlns="http://www.w3.org/2000/svg" width="160" height="40" viewBox="0 0 160 40" role="img" aria-labelledby="logoTitle logoDesc">
  <title id="logoTitle">E.T.P. logo</title>
  <desc id="logoDesc">Logo E.T.P. — éducation, tableau de bord</desc>
  <defs>
    <linearGradient id="g" x1="0" x2="1">
      <stop offset="0%" stop-color="#3f51b5"/>
      <stop offset="100%" stop-color="#5c6bc0"/>
    </linearGradient>
  </defs>
  <rect width="40" height="40" rx="8" fill="url(#g)" />
  <g transform="translate(48, 10)" fill="#222" font-family="Sora, sans-serif">
    <text x="0" y="0" font-size="14" font-weight="700" fill="#1e293b">E.T.P.</text>
    <text x="0" y="16" font-size="11" fill="#475569">Pilotage enseignant</text>
  </g>
</svg>